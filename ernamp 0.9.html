<style>
    .ohno-face { width: 150px; height: 150px; position: absolute; bottom: 5px; right: 28px; z-index: 999; transform: scale(0.35) rotate(30deg); transform-origin: bottom right; border: 8px solid var(--skin-accent); border-radius: 50%; background-color: transparent; background-image: radial-gradient(circle at 50% 80%, var(--skin-accent) 7%, transparent 8%), radial-gradient(ellipse 17% 30% at 66% 45%, var(--skin-accent) 95%, transparent 100%), radial-gradient(ellipse 17% 30% at 34% 45%, var(--skin-accent) 95%, transparent 100%); background-repeat: no-repeat; animation: blink 9s infinite; filter: drop-shadow(0 0 2px var(--skin-accent)); transition: all 0.5s ease; cursor: pointer; }
    .ohno-face:hover { filter: drop-shadow(0 0 12px var(--skin-accent)) brightness(1.2); }
    @keyframes blink { 0%,96%,100% { background-image: radial-gradient(circle at 50% 80%, var(--skin-accent) 7%, transparent 8%), radial-gradient(ellipse 17% 30% at 66% 45%, var(--skin-accent) 95%, transparent 100%), radial-gradient(ellipse 17% 30% at 34% 45%, var(--skin-accent) 95%, transparent 100%); } 97%,99% { background-image: radial-gradient(circle at 50% 80%, var(--skin-accent) 7%, transparent 8%), radial-gradient(ellipse 17% 2% at 66% 45%, var(--skin-accent) 95%, transparent 100%), radial-gradient(ellipse 17% 2% at 34% 45%, var(--skin-accent) 95%, transparent 100%); } }
    .about-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(4px); }
    .about-window { width: 400px; background: var(--skin-bg); border: 2px solid var(--skin-accent); padding: 30px; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.5); font-family: 'JetBrains Mono', monospace; color: var(--skin-text); }
    .about-close { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: var(--skin-accent); font-weight: 900; }
    .about-close:hover { color: var(--skin-text); }
    .about-header { font-size: 14px; font-weight: 900; margin-bottom: 20px; border-bottom: 1px solid var(--skin-border); padding-bottom: 10px; color: var(--skin-accent); }
    .about-content { font-size: 10px; line-height: 1.6; }
    .about-content b { color: var(--skin-accent); }
   :root { 
    --skin-bg: #F8F4E6; 
    --skin-panel: #ECE4C8; 
    --skin-border: #D7CB9E; 
    --skin-text: #302F26; 
    --skin-accent: #BB8844; 
    --skin-knob: conic-gradient(#ECE4C8, #F8F4E6, #D7CB9E, #ECE4C8); 
    --skin-texture: radial-gradient(#d7cb9e 0.5px, transparent 0.5px); 
    --texture-size: 3px 3px;
    --crt-bg: #1a1a1a;
    --crt-texture: none;
    --crt-texture-size: auto;
    --side-bg: #ECE4C8;
    --foot-bg: #ECE4C8;

    
    /* ADD THESE THREE LINES BELOW */
    --skin-text-dim: rgba(48, 47, 38, 0.6); 
    --skin-shadow: rgba(0, 0, 0, 0.15);
    --skin-led-off: #333333;

    /* Texture layer controls (for Omni-Forge WYSIWYG preview) */
    --skin-texture-opacity: 1;
    --skin-texture-blend: normal;
}

/* Now define the metal override outside */
body[class*="skin-metal"] { 
    --skin-texture: conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0.1) 0deg, transparent 90deg, rgba(0,0,0,0.1) 180deg, transparent 270deg, rgba(255,255,255,0.1) 360deg); 
    --texture-size: 100% 100%; 
}
    * { box-sizing: border-box; outline: none; user-select: none; }
    body { background: #CDC9B8; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'JetBrains Mono', monospace; color: var(--skin-text); overflow: hidden; }
.chassis { 
    position: relative; 
    width: 1080px; 
    height: 700px; 
    border-radius: var(--skin-radius);
    overflow: hidden; 
    border: 1px solid var(--skin-border);
    box-shadow: 15px 15px 50px var(--skin-shadow);
    
    /* 1. THE LAYERING ENGINE */
    /* background-image handles both textures (top) and gradients (bottom) */
    /* We include var(--skin-bg) here because gradients are technically images */
    background-image: var(--skin-bg);
    background-size: auto;
    background-color: var(--skin-bg); /* Fallback for solid hex colors */
    
    /* 2. THE GRID LAYOUT */
    display: grid; 
    grid-template-columns: 200px 1fr; 
    grid-template-rows: 1fr 200px; 
}

/* Texture overlay so we can control opacity/blend */
.chassis::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: var(--skin-texture);
    background-size: var(--texture-size);
    opacity: var(--skin-texture-opacity);
    mix-blend-mode: var(--skin-texture-blend);
    pointer-events: none;
    z-index: 0;
}

/* Keep normal panels above texture overlay, but don't break absolute children (e.g. ohno-face) */
.chassis > .sidebar,
.chassis > .stage,
.chassis > .footer {
    position: relative;
    z-index: 1;
}

.sidebar { 
    grid-row: 1 / span 2; 
    padding: 12px; 
    display: flex; 
    flex-direction: column; 
    gap: 4px; 
    overflow: hidden; 
    border-right: 1px solid var(--skin-border);
    
    /* THE TEXTURE FIX */
    background-color: var(--sidebar-bg, var(--skin-panel)); 
    background-image: var(--skin-texture); 
    background-size: var(--texture-size);
}

.footer { 
    display: grid; 
    grid-template-columns: 110px 140px 220px 200px 1fr; 
    align-items: center; 
    padding: 0 15px; 
    gap: 10px; 
    border-top: 1px solid var(--skin-border);
    
    /* THE TEXTURE FIX */
    background-color: var(--footer-bg, var(--skin-panel)); 
    background-image: var(--skin-texture); 
    background-size: var(--texture-size);
}
    #station-search { width: 100%; background: var(--skin-bg); border: 1px solid var(--skin-border); padding: 8px; font-family: inherit; font-size: 9px; color: var(--skin-text); text-transform: uppercase; margin-bottom: 10px; }
    .genre-list { overflow-y: auto; flex-grow: 1; padding-right: 4px; scrollbar-width: none; }
    .genre-section-lbl { font-size: 7.5px; font-weight: 900; color: var(--skin-text-dim); margin: 12px 0 4px 0; letter-spacing: 1px; border-bottom: 1px solid var(--skin-border); padding-bottom: 2px; }
    .genre-item { font-size: 8.5px; color: var(--skin-text-dim); text-transform: uppercase; cursor: pointer; padding: 3px 0; border-left: 2px solid transparent; transition: 0.1s; }
    .genre-item:hover, .genre-item.active { color: var(--skin-text); border-left-color: var(--skin-accent); padding-left: 6px; }
    .stage { 
    position: relative; 
    background-color: var(--crt-bg); 
    /* This link is the key: */
    background-image: var(--crt-texture); 
    background-size: var(--crt-texture-size);
    
    overflow: hidden; 
    border-bottom: 2px solid var(--skin-border); 
}
    #vis-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; z-index: 2; }
    .drawer { position: absolute; bottom: 0; left: 0; width: 100%; height: 0; background: var(--skin-bg); border-top: 1px solid var(--skin-border); transition: 0.25s; overflow-y: auto; z-index: 10; opacity: 0.98; }
    .drawer.open { height: 65%; }
    .vis-hotspot { position: absolute; font-size: 5px; font-weight: 800; color: var(--skin-text-dim); text-transform: uppercase; cursor: pointer; z-index: 5; transition: 0.1s; }
    .vis-hotspot.active { color: var(--skin-text); }
    .pos-led { position: absolute; width: 4px; height: 4px; background: var(--skin-led-off); border-radius: 50%; top: 50%; left: 50%; pointer-events: none; }
    .pos-led.active { background: var(--skin-accent); box-shadow: 0 0 6px var(--skin-accent); }
    

    .knob-wrap { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: visible; }
    .knob { 
    border-radius: 50%; 
    /* Use background-image for the gradient and background-color for the backup */
    background-image: var(--knob-main); 
    background-color: var(--skin-accent); 
    border: 2px solid var(--skin-border); 
    box-shadow: 2px 2px 8px var(--skin-shadow); 
    position: relative; 
    transition: transform 0.1s; 
    cursor: pointer;
    display: flex;
    justify-content: center;
}

/* Shift the ring and hotspots up independently of the knob */
#led-ring {
    transform: translateY(40px); /* Adjust this value to move them higher/lower */
}

/* Ensure the hotspots also respect the container shift */
.vis-hotspot {
    transform-origin: center;
}

.knob::after {
    content: "";
    position: absolute;
    top: 5px;
    width: 2px;
    height: 10px;
    background: var(--skin-text);
    border-radius: 1px;
    opacity: 0.8;
}
    .transport-knob, .mode-knob { width: 85px; height: 85px; cursor: pointer; }
    .gain-knob { width: 140px; height: 140px; cursor: ns-resize; z-index: 2; touch-action: none; }
    .gain-scale { position: absolute; width: 220px; height: 220px; pointer-events: none; display: flex; align-items: center; justify-content: center; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; }
    .gain-tick { position: absolute; width: 20px; height: 20px; z-index: 4; color: var(--skin-text); font-size: 10px; font-weight: 900; text-align: center; line-height: 20px; text-shadow: 0 1px 2px rgba(0,0,0,0.55); }
    .st-row { display: grid; grid-template-columns: 10px 1fr 30px; padding: 10px 12px; border-bottom: 1px solid var(--skin-border); cursor: pointer; font-size: 9px; color: var(--skin-text-dim); text-transform: uppercase; align-items: center; }
    .st-row:hover { background: rgba(0,0,0,0.05); }
    .st-name-grad { font-weight: 800; background: linear-gradient(to right, var(--skin-text) 60%, var(--skin-text-dim) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fav-btn { cursor: pointer; text-align: center; font-size: 12px; color: var(--skin-text-dim); }
    .fav-btn.active { color: var(--skin-accent); }
    .lbl-etched { font-size: 8px; font-weight: 800; color: var(--skin-text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; }
    .mgmt-btn { width: 100%; background: var(--skin-bg); border: 1px solid var(--skin-border); color: var(--skin-text); font-size: 8px; padding: 6px; cursor: pointer; font-weight: 900; margin: 10px 0; }
    select#skin-selector { font-family: inherit; font-size: 7px; background: var(--skin-bg); color: var(--skin-text); border: 1px solid var(--skin-border); padding: 1px 4px; cursor: pointer; margin-top: 4px; width: 120px; }
    .video-js { display: none; }
    .seek-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 15; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); display: flex; flex-direction: column; align-items: center; }
    .stage:hover .seek-wrapper { transform: translateY(0); }
    .transport-cluster { display: flex; gap: 20px; justify-content: center; margin-bottom: 12px; }
    .t-btn { 
    width: 44px; 
    height: 44px; 
    border-radius: 50%; 
    
    /* 1. Use the new knob variable for the idle state */
    background-image: var(--knob-main);
    background-color: var(--skin-panel); /* Fallback */
    
    border: 2px solid var(--skin-border); 
    box-shadow: 2px 4px 10px var(--skin-shadow); 
    
    /* 2. Text/Icon color */
    color: var(--skin-text); 
    font-size: 14px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    transition: 0.2s; 
}

/* 3. Hover state: Make them glow with the accent color */
.t-btn:hover {
    color: var(--skin-accent);
    border-color: var(--skin-accent);
    box-shadow: 0 0 15px var(--skin-accent);
    transform: translateY(-2px);
}

/* 4. Active state for toggled buttons (like Loop or EQ) */
.t-btn.active {
    background: var(--skin-accent);
    color: var(--skin-panel);
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
}
    .seek-container { width: 100%; height: 26px; background: var(--skin-bg); border-top: 1px solid var(--skin-border); display: flex; align-items: center; padding: 0 15px; gap: 12px; }
    .seek-bar { flex-grow: 1; height: 8px; background: rgba(0,0,0,0.1); cursor: pointer; position: relative; border-radius: 4px; border: 1px solid var(--skin-border); }
    .seek-fill { height: 100%; background: var(--skin-accent); width: 0%; pointer-events: none; border-radius: 4px; position: relative; }
    .seek-thumb { position: absolute; right: 0; top: 50%; transform: translate(50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: var(--skin-knob); border: 2px solid var(--skin-border); }
    .seek-time { font-size: 9px; color: var(--skin-text); font-weight: 800; min-width: 35px; text-align: center; }
    #stage-station { position: absolute; top: 12px; left: 20px; font-size: 11px; font-weight: 900; color: var(--skin-accent); text-transform: uppercase; z-index: 20; pointer-events: none; text-shadow: 0 0 6px #000; }
    .side-controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px; justify-content: center; transform: translateY(-21px); }
   .side-btn { 
    width: 44px; 
    height: 44px; 
    border-radius: 50%; 
    
    /* 1. Use the knob engine for the background */
    background-image: var(--knob-main);
    background-color: var(--skin-panel); /* Fallback for solid skins */
    
    border: 2px solid var(--skin-border); 
    color: var(--skin-text-dim); 
    font-size: 6.5px; 
    font-weight: 900; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    line-height: 1.1; 
    text-transform: uppercase;
    transition: 0.2s;
    box-shadow: 2px 2px 5px var(--skin-shadow);
}

/* 2. Hover state: Matches the knob glow */
.side-btn:hover { 
    color: var(--skin-accent); 
    border-color: var(--skin-accent); 
    box-shadow: 0 0 10px var(--skin-accent);
    transform: scale(1.05); /* Slight pop when hovering */
}

/* 3. Active state: When that specific menu is open */
.side-btn.active {
    background: var(--skin-accent);
    color: var(--skin-panel);
    border-color: var(--skin-text);
}
    .led {
        width: 8px;
        height: 8px;
        background-color: var(--skin-led-off);
        border-radius: var(--led-radius); 
        transition: all 0.2s ease;
        display: inline-block; /* Ensure they sit next to each other */
        margin: 2px;
    }

    .led.active {
        background-color: var(--skin-accent);
        box-shadow: var(--led-glow); 
    }

    /* --- OMNI-FORGE (drawer editor) compact UI --- */
    .forge-wrap { padding: 8px 10px; }
    .forge-top { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom: 6px; }
    .forge-title { font-size: 9px; font-weight: 900; letter-spacing: 1px; color: var(--skin-text); text-transform: uppercase; }
    .forge-sub { font-size: 7px; color: var(--skin-text-dim); line-height: 1.2; }
    .forge-grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
    .forge-grid-2 { display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; }
    .forge-row { display:grid; grid-template-columns: 60px 1fr; gap:8px; align-items:center; }
    .forge-label { font-size: 7px; color: var(--skin-text-dim); font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
    .forge-help { font-size: 7px; color: var(--skin-text-dim); margin-top: 2px; }
    .forge-card { border: 1px solid var(--skin-border); background: rgba(0,0,0,0.03); padding: 8px; border-radius: 6px; }
    .forge-card .genre-section-lbl { margin-top: 0; }
    .forge-wrap input[type="color"] { width: 20px; height: 18px; padding: 0; border: 1px solid var(--skin-border); background: transparent; }
    .forge-wrap input[type="range"] { width: 100%; height: 12px; }
    .forge-wrap select { width: 100%; font-size: 8px; background: var(--skin-bg); color: var(--skin-text); border: 1px solid var(--skin-border); padding: 4px; }
    .forge-mini { display:flex; gap:6px; align-items:center; }
    .forge-pill { font-size: 7px; font-weight: 900; letter-spacing: 1px; padding: 3px 6px; border: 1px solid var(--skin-border); border-radius: 999px; color: var(--skin-text-dim); background: rgba(0,0,0,0.02); }
    .forge-actions { display:flex; gap:8px; margin-top: 8px; }
    .forge-actions .mgmt-btn { margin: 0; }
    .forge-knob-preview { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--skin-border); background-image: var(--knob-main); box-shadow: 1px 2px 6px rgba(0,0,0,0.25); }

    /* Forge mode: disable player popups/seek UI */
    body.forge-mode .seek-wrapper { display: none; }
    body.forge-mode .seek-bar,
    body.forge-mode .t-btn { pointer-events: none; }
	#forge-toggle-btn {
    position: relative;
    
    left: -24px;  /* Moves it right */
</style>

<body>

<input type="file" id="file-input" multiple accept="audio/*,video/*" style="display:none;" onchange="app.handleFiles(this.files)">
<input type="file" id="playlist-input" accept=".js,.m3u" style="display:none;" onchange="app.loadPlaylistFile(this.files[0])">

<div class="chassis">
    <div class="sidebar">
        <div style="font-size: 11px; font-weight: 900; color: var(--skin-text); margin-bottom: 10px; letter-spacing: 2px;">ERNDUB AUDIO v1.2</div>

        <div class="genre-list" id="genre-box"></div>
    </div>
    <div class="stage">
        <video class="video-js" crossorigin="anonymous" id="audio-engine"></video>
        <canvas id="vis-canvas"></canvas>
        <div id="stage-station"></div>

        <div class="seek-wrapper">
            <div class="transport-cluster">
                <div class="t-btn" onclick="app.playPrev()">|&lt;</div>
                <div class="t-btn" onclick="app.toggleTransport()">▶</div>
                <div class="t-btn" onclick="app.toggleTransport()">❚❚</div>
                <div class="t-btn" onclick="app.stopStream()">■</div>
                <div class="t-btn" onclick="app.playNext()">&gt;|</div>
            </div>
            <div class="seek-container">
                <span class="seek-time" id="time-curr">0:00</span>
                <div class="seek-bar" onclick="app.handleSeek(event)" id="seek-bar">
                    <div class="seek-fill" id="seek-fill"><div class="seek-thumb"></div></div>
                </div>
                <span class="seek-time" id="time-total">0:00</span>
            </div>
        </div>

        <div class="drawer" id="station-drawer" onmousemove="app.resetDrawerTimer()">
            <div id="drawer-header"></div>

        </div>
    </div>
    <div class="footer">
        <div class="telemetry" style="font-size:8px;">
            <div>SIGNAL: <b id="t-sig">IDLE</b></div>
            <div>AMP: <b id="t-vol">70%</b></div>
            <div>STATE: <b id="t-status">HALT</b></div>
        </div>
        <div class="knob-wrap">
            <div class="knob transport-knob" id="trans-knob" onclick="app.toggleTransport()" onwheel="app.handleSkinScroll(event)"></div>
            <div class="lbl-etched">PLAY / PAUSE</div>
            <select id="skin-selector" onchange="app.changeSkin(this.value)"></select>
        </div>
        <div class="knob-wrap" id="radial-stage" style="width:210px; height:210px;">
            <div id="led-ring"></div>
            <div class="knob mode-knob" id="mode-knob" onclick="app.handleModeClick()" onwheel="app.handleVisScroll(event)"></div>
           <div class="lbl-etched"></div> 
        </div>
        <div class="knob-wrap">
            <div class="gain-scale" id="gain-scale"></div>
            <div class="knob gain-knob" id="gain-knob"></div>
            <div class="lbl-etched">GAIN</div>
        </div>
        <div class="side-controls">
            <button class="side-btn" onclick="document.getElementById('playlist-input').click()">LOAD<br>PL</button>
            <button class="side-btn" onclick="app.exportPlaylistJS()">EXP .JS</button>
            <button class="side-btn" onclick="app.exportPlaylistM3U()">EXP .M3U</button>
            <button class="side-btn" onclick="document.getElementById('file-input').click()">LOCAL<br>FILES</button>
            <button class="side-btn" id="forge-toggle-btn" onclick="app.toggleForge()">SKIN<br>FORGE</button>
			
        </div>
    </div>
    
    <div class="ohno-face" onclick="document.getElementById('about-modal').style.display='flex'"></div>
    
    <div id="about-modal" class="about-overlay">
        <div class="about-window">
            <div class="about-close" onclick="document.getElementById('about-modal').style.display='none'">×</div>
            <div class="about-header">SYSTEM INFORMATION</div>
            <div class="about-content">
                <p><b>APP:</b> ERNDUB AUDIO v0.9 (nearly there!) Hello Phil !!</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    const app = {
        mIdx: 0, sIdx: 0, vol: 0.7, gRot: -140, isPlaying: false,
        favorites: JSON.parse(localStorage.getItem('erndub_favs') || '[]'),
        history: JSON.parse(localStorage.getItem('erndub_hist') || '[]'),
        lastPlayed: JSON.parse(localStorage.getItem('erndub_last') || 'null'),
        playlist: [], playlistIdx: -1,
        allStationsMap: new Map(),
        rumpleOrbs: Array.from({ length: 1500 }, () => ({ x: Math.random()*1080, y: Math.random()*700, r: Math.random()*3+1, opacity: Math.random()*0.4, speed: Math.random()*0.4+0.1 })),
        rumpleParticles: [],
        particles: Array.from({ length: 150 }, () => ({ x: Math.random()*1080, y: Math.random()*700, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: Math.random() })),
init() {
    this.ctx = document.getElementById('vis-canvas').getContext('2d');
    this.mirror = 'https://all.api.radio-browser.info';

    const savedVol = localStorage.getItem('erndub_vol');
    const savedSkin = localStorage.getItem('erndub_skin');
    const savedMode = localStorage.getItem('erndub_mode');

    // 1. Handle Volume
    if (savedVol) {
        this.vol = parseFloat(savedVol);
        this.gRot = (this.vol * 280) - 140;
    }

    this.player = videojs('audio-engine', {}, () => this.player.volume(this.vol));
    this.player.on('ended', () => this.playNext());

    this.renderGenreList();
    this.populateSkinSelector();
    this.setupControls();
    this.resize();
    window.onresize = () => this.resize();

        setupControls() {
            const ring = document.getElementById('led-ring');
            const stage = document.getElementById('radial-stage');
            const modes = window.MODES || ['INFO-HUD','VIDEO_MODE','GLISTEN','RUMPLE','RUMPLE 2','POLAR','VU-METER','LATTICE','SINGULARITY','LED-BAR','SPIRALS','PARTICLES','PARTICLES2','PIC','VIS_OFF'];
            
            modes.forEach((m, i) => {
                const angle = (i * (360/modes.length)) - 90;
                const led = document.createElement('div'); led.className = 'pos-led';
             led.style.transform = `rotate(${angle}deg) translate(52px) translateY(10px) `; 
    ring.appendChild(led);
                const lbl = document.createElement('div'); lbl.innerText = m; lbl.className = 'vis-hotspot';
                lbl.style.cssText = `transform: rotate(${angle}deg) translate(78px) rotate(${-angle}deg);`;
                lbl.onclick = () => this.setMode(i); stage.appendChild(lbl);
            });

            // Gain knob labels 1-11
            const scale = document.getElementById('gain-scale');
            scale.innerHTML = '';
            for (let i = 1; i <= 11; i++) {
                const angle = -140 + ((i-1) * 28);
                const tick = document.createElement('div');
                tick.className = 'gain-tick';
                tick.innerText = i;
                tick.style.transform = `rotate(${angle}deg) translate(0, -88px) rotate(${-angle}deg)`;
                scale.appendChild(tick);
            }

            const gainKnob = document.getElementById('gain-knob');

            gainKnob.addEventListener('wheel', (e) => {
                e.preventDefault();
                this.gRot = Math.max(-140, Math.min(140, this.gRot - e.deltaY * 0.12));
                this.vol = (this.gRot + 140) / 280;
                this.player.volume(this.vol);
                this.updateGainUI();
            });

            // Drag up/down to adjust gain (mouse/touch/pen)
            const dragState = { active: false, startY: 0, startRot: 0, pointerId: null };
            const rotFromDeltaY = (dy) => dragState.startRot + (-dy * 0.6); // px -> degrees

            const onMove = (e) => {
                if (!dragState.active) return;
                const dy = e.clientY - dragState.startY;
                this.gRot = Math.max(-140, Math.min(140, rotFromDeltaY(dy)));
                this.vol = (this.gRot + 140) / 280;
                if (this.player) this.player.volume(this.vol);
                this.updateGainUI();
                e.preventDefault();
            };

            const endDrag = () => {
                if (!dragState.active) return;
                dragState.active = false;
                dragState.pointerId = null;
                window.removeEventListener('pointermove', onMove, { capture: true });
                window.removeEventListener('pointerup', endDrag, { capture: true });
                window.removeEventListener('pointercancel', endDrag, { capture: true });
            };

            gainKnob.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                dragState.active = true;
                dragState.startY = e.clientY;
                dragState.startRot = this.gRot;
                dragState.pointerId = e.pointerId;
                gainKnob.setPointerCapture?.(e.pointerId);
                window.addEventListener('pointermove', onMove, { capture: true });
                window.addEventListener('pointerup', endDrag, { capture: true });
                window.addEventListener('pointercancel', endDrag, { capture: true });
            });
        },

// --- SKIN & UI MANAGEMENT ---
  changeSkin(skinName) {
        const s = (window.SKINS || {})[skinName];
        if (!s) return;

        const r = document.documentElement;

        // 1. Apply Standard Colors & Radius
        r.style.setProperty('--skin-bg', s.bg);
        r.style.setProperty('--skin-panel', s.panel || s.bg);
        r.style.setProperty('--skin-border', s.border);
        r.style.setProperty('--skin-text', s.text);
        r.style.setProperty('--skin-text-dim', s.textDim || "rgba(0,0,0,0.5)");
        r.style.setProperty('--skin-accent', s.accent);
        r.style.setProperty('--crt-bg', s.crtBg || "#000");
        r.style.setProperty('--skin-radius', s.radius || "8px");

        // 2. Handle Texture & LED Logic
        r.style.setProperty('--skin-texture', s.surface || "none");
        r.style.setProperty('--texture-size', s.size || "0px");
        r.style.setProperty('--led-radius', s.led?.shape || "50%");
        r.style.setProperty('--led-glow', s.led?.glow || "none");

        // 3. Picture Viz Mode Setup
        this.currentVizPic = s.vizPic || null;
        if (this.currentVizPic) {
            this.vizImageObj = new Image();
            this.vizImageObj.src = this.currentVizPic;
        } else {
            this.vizImageObj = null;
        }

        // 4. Knob Gradient Logic
        const knobValue = s.knob || s.accent;
        r.style.setProperty('--knob-main', knobValue);
        document.querySelectorAll('.knob').forEach(k => {
            k.style.backgroundImage = knobValue.includes('gradient') ? knobValue : 'none';
        });

        localStorage.setItem('erndub_skin', skinName);
    },

    formatTime(s) {

    async handleFiles(files) {

            if (!f.type.startsWith('audio/') && !f.type.startsWith('video/')) continue;
            const uuid = 'local_' + Date.now() + Math.random();
            const track = { name: f.name, stationuuid: uuid, isLocal: true, fileType: f.type, url_resolved: URL.createObjectURL(f) };
            this.playlist.push(track);
            this.allStationsMap.set(uuid, track);
        }
        this.openMyPlaylist();
    },

    loadPlaylistFile(file) {
        if (!file) return;
        alert("Playlist loading not fully implemented in this version.");
    },

    render() {
        requestAnimationFrame(() => this.render());
        const ctx = this.ctx, w = ctx.canvas.width, h = ctx.canvas.height;
        const root = getComputedStyle(document.body);
        const accent = root.getPropertyValue('--skin-accent').trim();
        const mode = (window.MODES || [])[this.mIdx];

        const curr = this.player ? this.player.currentTime() : 0;
        const dur = this.player ? this.player.duration() : 0;
        if (dur) {
            document.getElementById('time-curr').innerText = this.formatTime(curr);
            document.getElementById('time-total').innerText = this.formatTime(dur);
            document.getElementById('seek-fill').style.width = (curr / dur) * 100 + "%";
        }

        if (!this.analyser) {
            ctx.clearRect(0, 0, w, h);
            return;
        }

        this.analyser.getByteFrequencyData(this.fData);
        ctx.fillStyle = root.getPropertyValue('--crt-bg').trim();
        ctx.fillRect(0, 0, w, h);

        if (window.Visualizers && window.Visualizers.render) {
            window.Visualizers.render(ctx, w, h, mode, this.fData, this, accent, root.getPropertyValue('--skin-text').trim(), root.getPropertyValue('--skin-panel').trim());
            this.updateGainUI();
        }

        const isPicMode = String(mode || '').toLowerCase().includes('pic');
        if (isPicMode && this.vizImageObj && this.vizImageObj.complete) {
            const img = this.vizImageObj;
            const scale = Math.min(w / img.width, h / img.height);
            const destW = img.width * scale;
            const destH = img.height * scale;
            const x = (w / 2) - (destW / 2);
            const y = (h / 2) - (destH / 2);

            ctx.shadowBlur = 20;
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.drawImage(img, x, y, destW, destH);
            ctx.shadowBlur = 0;
        }
    }
}; // End of app object

                else if (k === 'sidebarAlp') el.value = String(this.state.sidebarAlp);
                else if (k === 'footerAlp') el.value = String(this.state.footerAlp);
                else if (k === 'texScale') {
                    const px = parseInt(String(this.state.texScale).split('px')[0], 10);

            this.state.s1 = skinBg;

            this.state.s5 = skinBg;
            this.state.angle = 90;
        }

        const skinPanel = read('--skin-panel'); if (skinPanel) this.state.panel = skinPanel;
        const skinBorder = read('--skin-border'); if (skinBorder) this.state.border = skinBorder;
        const skinText = read('--skin-text'); if (skinText) this.state.text = skinText;
        const skinTextDim = read('--skin-text-dim'); if (skinTextDim) this.state.textDim = skinTextDim;
        const skinAccent = read('--skin-accent'); if (skinAccent) this.state.accent = skinAccent;
        const crtBg = read('--crt-bg'); if (crtBg) this.state.crtBg = crtBg;

        const tex = read('--skin-texture');
        if (tex) {
            const match = Object.entries(this.textures).find(([, v]) => v === tex);
            if (match) this.state.texture = match[0];
        }
        const texScale = read('--texture-size'); if (texScale) this.state.texScale = texScale;
        const texOpacity = read('--skin-texture-opacity'); if (texOpacity) this.state.texOpacity = Number(texOpacity) || this.state.texOpacity;
        const texBlend = read('--skin-texture-blend'); if (texBlend) this.state.texBlend = texBlend;

        // Infer knob stops from --knob-main if it contains hex colors
        const knobMain = read('--knob-main');
        if (knobMain && knobMain.toLowerCase().includes('gradient')) {
           const colors = knobMain.match(/#[0-9a-fA-F]{3,8}/g) || [];
if (colors.length >= 3) {
    this.state.k1 = colors[0];
    this.state.k2 = colors[1];
    this.state.k3 = colors[2];
    this.state.k4 = colors[3] || colors[2]; // Fallback to 3rd color
    this.state.k5 = colors[4] || colors[0]; // Fallback to 1st color
}
        }

        if (typeof app?.currentVizPic === 'string' && app.currentVizPic.length) {
            this.state.vizPic = app.currentVizPic;

        // Bind inputs
        list.querySelectorAll('input[data-f], select[data-f]').forEach((el) => {

                if (!k) return;
                if (k === 'angle') this.state.angle = parseInt(el.value || '0', 10);
                else if (k === 'texOpacity') this.state.texOpacity = (parseInt(el.value || '0', 10) / 100);

                else if (k === 'sidebarAlp') this.state.sidebarAlp = parseInt(el.value || '0', 10);
                else if (k === 'footerAlp') this.state.footerAlp = parseInt(el.value || '0', 10);
                else this.state[k] = el.value;
                this.apply();

        // Bind image upload for vizPic (png/jpg/bmp as dataURL, svg as data url)
        const fileEl = document.getElementById('forge-viz-file');
        if (fileEl) {

                if (!f) return;
                const name = (f.name || '').toLowerCase();
                const isSvg = f.type === 'image/svg+xml' || name.endsWith('.svg');

                try {
                    if (isSvg) {
                        const text = await f.text();
                        const b64 = btoa(unescape(encodeURIComponent(text)));
                        this.state.vizPic = `data:image/svg+xml;base64,${b64}`;
                    } else {
                        const reader = new FileReader();
                        reader.onload = () => {
                            this.state.vizPic = String(reader.result || '');
                            this.apply();
                        };

                }
            });
        }

        this.apply();

    hexToRgba(hex, alpha01) {
        const h = (hex || '').trim();
        if (!/^#?[0-9a-fA-F]{6}$/.test(h)) return `rgba(0,0,0,${alpha01})`;
        const x = h.startsWith('#') ? h.slice(1) : h;
        const r = parseInt(x.slice(0, 2), 16);
        const g = parseInt(x.slice(2, 4), 16);
        const b = parseInt(x.slice(4, 6), 16);
        const a = Math.max(0, Math.min(1, alpha01));
        return `rgba(${r},${g},${b},${a})`;
    },
  apply() {
    const bgS = `linear-gradient(${this.state.angle}deg, ${this.state.s1} 0%, ${this.state.s3} 50%, ${this.state.s5} 100%)`;
    const r = document.documentElement.style;
    r.setProperty('--skin-bg', bgS);
    r.setProperty('--skin-panel', this.state.panel);
    r.setProperty('--skin-border', this.state.border);
    r.setProperty('--skin-text', this.state.text);
    r.setProperty('--skin-text-dim', this.state.textDim);
    r.setProperty('--skin-accent', this.state.accent);
    r.setProperty('--crt-bg', this.state.crtBg);

    // 1. Create the 5-color conic gradient string
    const knob = `conic-gradient(${this.state.k1}, ${this.state.k2}, ${this.state.k3}, ${this.state.k4}, ${this.state.k5}, ${this.state.k1})`;
    r.setProperty('--knob-main', knob);

    // 2. FORCE UPDATES to existing knob elements (Prevents the "frozen" preview)
    document.querySelectorAll('.knob').forEach(k => {
        k.style.backgroundImage = knob;
    });

    // 3. Update the transport and side buttons to match
    document.querySelectorAll('.t-btn, .side-btn').forEach(btn => {
        btn.style.backgroundImage = knob;
    });

    r.setProperty('--skin-texture', this.textures[this.state.texture] || 'none');
    r.setProperty('--texture-size', this.state.texScale);
    r.setProperty('--skin-texture-opacity', String(this.state.texOpacity));
    r.setProperty('--skin-texture-blend', this.state.texBlend);
    r.setProperty('--sidebar-bg', this.hexToRgba(this.state.sidebarClr, this.state.sidebarAlp / 100));
    r.setProperty('--footer-bg', this.hexToRgba(this.state.footerClr, this.state.footerAlp / 100));

    const prev = document.getElementById('forge-knob-preview');
    if (prev) prev.style.backgroundImage = knob;

    // Apply vizPic immediately
    if (typeof this.state.vizPic === 'string' && this.state.vizPic.length) {
        app.currentVizPic = this.state.vizPic;
        app.vizImageObj = new Image();
        app.vizImageObj.src = this.state.vizPic;
    }

    this.saveDraft();

     
    }
};

window.erndubForgeCopy = () => {
    const s = forge.state;
    const bgS = `linear-gradient(${s.angle}deg, ${s.s1} 0%, ${s.s3} 50%, ${s.s5} 100%)`;
    const out = {
        bg: bgS,
        panel: s.panel,
        border: s.border,
        text: s.text,
        textDim: s.textDim,
        accent: s.accent,
        crtBg: s.crtBg,
        vizPic: s.vizPic || undefined,
        knob: `conic-gradient(${s.k1}, ${s.k2}, ${s.k3}, ${s.k4}, ${s.k5}, ${s.k1})`,
        surface: forge.textures[s.texture] || 'none',
        size: s.texScale,
        textureOpacity: s.texOpacity,
        textureBlend: s.texBlend,
        sidebar: forge.hexToRgba(s.sidebarClr, s.sidebarAlp / 100),
        footer: forge.hexToRgba(s.footerClr, s.footerAlp / 100)
    };
    // Remove undefined fields for nicer output
    navigator.clipboard?.writeText(JSON.stringify(out, (k, v) => (v === undefined ? undefined : v), 2));
};

window.erndubForgeExit = () => {
    // Restore original skin if we have a backup
    if (forge.originalSkin) {
        const r = document.documentElement.style;
        Object.keys(forge.originalSkin).forEach(key => {
            r.setProperty(key, forge.originalSkin[key]);
        });

        // Restore knobs
        document.querySelectorAll('.knob, .t-btn, .side-btn').forEach(el => {
            if (forge.originalSkin['--knob-main']) {
                el.style.backgroundImage = forge.originalSkin['--knob-main'];
            }
        });

        // Restore viz pic
        if (forge.originalVizPic) {
            app.currentVizPic = forge.originalVizPic;
            app.vizImageObj = new Image();
            app.vizImageObj.src = forge.originalVizPic;
        } else {
            app.currentVizPic = null;
            app.vizImageObj = null;
        }
    }

    // Re-enable player UI (sidebar/search) before leaving
    forge?.setPlayerControlsEnabled?.(true);
    forge.on = false;

    // Clear backup
    delete forge.originalSkin;
    delete forge.originalVizPic;

    // 1. Update the URL hash without reloading the page
    history.pushState(null, null, ' '); 

    // 2. Restore normal drawer behavior
    app.closeDrawer();
    // Restore the original timer function
    app.resetDrawerTimer = function() { 
        if(this.dt) clearTimeout(this.dt); 
        this.dt = setTimeout(() => this.closeDrawer(), 8000); 
    };

    // 3. Update the toggle button text
    app.updateForgeToggleUI();
};

window.erndubForgeSnapshot = () => forge.saveSnapshot();

window.erndubForgeDeletePreset = (i) => forge.deletePreset(i);

window.erndubForgeExportSkinsFile = () => {
    const s = forge.state;
    const bgS = `linear-gradient(${s.angle}deg, ${s.s1} 0%, ${s.s3} 50%, ${s.s5} 100%)`;
    const entry = {
        bg: bgS,
        panel: s.panel,
        border: s.border,
        text: s.text,
        textDim: s.textDim,
        accent: s.accent,
        crtBg: s.crtBg,
        ...(s.vizPic ? { vizPic: s.vizPic } : {}),
        knob: `conic-gradient(${s.k1}, ${s.k2}, ${s.k3}, ${s.k1})`,
        surface: forge.textures[s.texture] || 'none',
        size: s.texScale,
        sidebar: forge.hexToRgba(s.sidebarClr, s.sidebarAlp / 100),
        footer: forge.hexToRgba(s.footerClr, s.footerAlp / 100)
    };

    const content = `// Paste into skins.js (or load as a script)\n\nwindow.SKINS = window.SKINS || {};\nwindow.SKINS[${JSON.stringify('Custom Forge Skin')}] = ${JSON.stringify(entry, null, 2)};\n`;
    const blob = new Blob([content], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'erndub_forge_skin.js';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
};

        prevOnload?.();
        forge.mount();
        app.updateForgeToggleUI?.();
    };
} else {
    const prevOnload2 = window.onload;

    };
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>erndub remote</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js">
  setInterval(() => {
    const age = window._lastHostHb ? (Date.now() - window._lastHostHb) / 1000 : 999;
    if (age > 8) {
      try { statusEl.textContent = 'Host quiet'; } catch (e) {}
    }
  }, 2000);
</script>
<style>
  :root {
    --bg: #141210; --panel: #242018; --border: #4a4436;
    --text: #e8e0d0; --dim: #9a9080; --accent: #c4843a;
    --ok: #5a9a5a; --bad: #a05040;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none;
  }
  .wrap {
    max-width: 420px; margin: 0 auto; min-height: 100%;
    padding: 12px 14px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; min-height: 22px;
  }
  .led-wrap {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
    color: var(--dim);
  }
  .led-wrap.on { color: var(--ok); }
  .led {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--bad);
    box-shadow: 0 0 6px var(--bad);
    flex: 0 0 auto;
  }
  .led-wrap.on .led {
    background: var(--ok);
    box-shadow: 0 0 10px var(--ok);
  }
  .brand {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); font-weight: 800;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
  }
  .pair-card.hidden { display: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  input {
    flex: 1; min-width: 0;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px;
    padding: 12px 14px; font-size: 16px; letter-spacing: 2px;
    text-transform: uppercase;
  }
  button {
    appearance: none; border: 1px solid var(--border);
    background: #353028; color: var(--text);
    border-radius: 12px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; font-size: 13px;
    padding: 14px 12px; cursor: pointer;
  }
  button:active { transform: scale(0.97); background: #403828; }
  button.accent { border-color: var(--accent); color: var(--accent); }
  button.wide { flex: 1; }
  button.big { font-size: 18px; padding: 22px 12px; }
  .err { color: #e08070; font-size: 11px; margin-top: 6px; min-height: 1.1em; }
  .viz-card {
    padding: 0; overflow: hidden; position: relative;
    aspect-ratio: 16 / 9;
    background: #0a0a08;
  }
  #mini-viz {
    display: block; width: 100%; height: 100%;
  }
  .viz-label {
    position: absolute; left: 8px; bottom: 6px;
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    color: rgba(232,224,208,0.55); pointer-events: none;
  }
  .now .label { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .now .title {
    font-size: 15px; font-weight: 700; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .now .meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .vol { display: flex; align-items: center; gap: 10px; }
  .vol input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .vol-val { width: 42px; text-align: right; font-size: 13px; font-weight: 700; color: var(--accent); }
  .hint { font-size: 11px; color: var(--dim); line-height: 1.45; }
  .hint.hidden { display: none; }
  .fob-flash {
    display: none; position: fixed; inset: 0; z-index: 100;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(255,90,40,0.55), rgba(255,40,20,0.15) 55%, transparent 70%);
    animation: fobPulse 0.9s ease-out;
  }
  .fob-flash.show { display: block; }
  .fob-flash .fob-msg {
    position: absolute; left: 50%; top: 28%; transform: translateX(-50%);
    background: rgba(20,12,8,0.85); border: 2px solid #f84;
    color: #fff; font-weight: 800; letter-spacing: 1px;
    padding: 12px 18px; border-radius: 12px; font-size: 15px;
    text-align: center; max-width: 90%;
  }
  @keyframes fobPulse {
    0% { opacity: 0; }
    15% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="fob-flash" id="fob-flash"><div class="fob-msg" id="fob-msg">RF ACTIVITY</div></div>
<div class="wrap">
  <div class="topbar">
    <div class="led-wrap" id="led-wrap"><span class="led" id="led"></span><span id="status">Offline</span></div>
    <div class="brand">erndub</div>
  </div>

  <div class="card pair-card" id="pair-card">
    <div class="row">
      <input id="code" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"/>
      <button type="button" class="accent" id="btn-connect">Connect</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="card viz-card">
    <canvas id="mini-viz" width="360" height="200"></canvas>
    <div class="viz-label" id="viz-mode">—</div>
  </div>

  <div class="card now">
    <div class="label">Now playing</div>
    <div class="title" id="np-title">—</div>
    <div class="meta" id="np-meta">vol —</div>
  </div>

  <div class="grid3">
    <button type="button" class="wide" data-cmd="prev">Prev</button>
    <button type="button" class="wide big accent" data-cmd="toggle">Play</button>
    <button type="button" class="wide" data-cmd="next">Next</button>
  </div>

  <div class="card">
    <div class="vol">
      <button type="button" data-cmd="volDown" style="padding:10px 12px">−</button>
      <input type="range" id="vol" min="0" max="100" value="70"/>
      <button type="button" data-cmd="volUp" style="padding:10px 12px">+</button>
      <span class="vol-val" id="vol-val">70%</span>
    </div>
  </div>

  <div class="grid2">
    <button type="button" data-cmd="mute">Mute</button>
    <button type="button" data-cmd="stop">Stop</button>
    <button type="button" data-cmd="shuffle">Shuffle</button>
    <button type="button" data-cmd="repeat">Repeat</button>
    <button type="button" data-cmd="modePrev">Prev viz</button>
    <button type="button" data-cmd="modeNext">Next viz</button>
  </div>

  <div class="grid2" id="rf-row">
    <button type="button" data-cmd="rfSweep">Sweep 433</button>
    <button type="button" data-cmd="rfListen">Listen fob 20s</button>
  </div>

  <div class="hint" id="hint">
    PC: SYSTEM → Remote · enter code · Connect
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const ledWrap = $('led-wrap');
  const errEl = $('err');
  const codeInp = $('code');
  const pairCard = $('pair-card');
  const hint = $('hint');
  const npTitle = $('np-title');
  const npMeta = $('np-meta');
  const volEl = $('vol');
  const volVal = $('vol-val');
  const playBtn = document.querySelector('[data-cmd="toggle"]');
  const vizModeEl = $('viz-mode');
  const canvas = $('mini-viz');
  const ctx = canvas.getContext('2d');

  let peer = null;
  let conn = null;
  let lastVolSend = 0;
  let vizMode = '';
  let fData = new Uint8Array(32);
  let playing = false;
  let raf = 0;
  let t0 = performance.now();

  const saved = localStorage.getItem('erndub_remote_code') || '';
  if (saved) codeInp.value = saved;

  function setStatus(text, on) {
    statusEl.textContent = text;
    ledWrap.classList.toggle('on', !!on);
    if (on) {
      pairCard.classList.add('hidden');
      hint.classList.add('hidden');
    }
  }
  function setErr(msg) { errEl.textContent = msg || ''; }

  function hostIdFromCode(raw) {
    let c = String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!c) return '';
    if (!c.startsWith('ERNDUB')) c = 'ERNDUB' + c;
    return c.toLowerCase();
  }

  function send(cmd, data) {
    if (!conn || !conn.open) {
      setErr('Not connected');
      return;
    }
    try {
      conn.send({ t: 'cmd', cmd, data: data || null, ts: Date.now() });
    } catch (e) {
      setErr('Send failed');
    }
  }

  let lastAlertTs = 0;
  function triggerFobFlash(msg) {
    const el = $('fob-flash');
    const m = $('fob-msg');
    if (!el) return;
    if (m) m.textContent = msg || 'RF ACTIVITY';
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 900);
  }
  function applyState(s) {
    if (!s || typeof s !== 'object') return;
    if (s.rfAlert && s.rfAlert.ts && s.rfAlert.ts !== lastAlertTs) {
      // only flash on new alerts within last 8s
      const age = Date.now() / 1000 - s.rfAlert.ts;
      if (age >= 0 && age < 8) {
        lastAlertTs = s.rfAlert.ts;
        triggerFobFlash(s.rfAlert.message || 'RF ACTIVITY');
      }
    }
    if (s.title) npTitle.textContent = s.title;
    if (s.mode) {
      vizMode = String(s.mode);
      vizModeEl.textContent = vizMode;
    }
    if (s.playing != null) {
      playing = !!s.playing;
      playBtn.textContent = playing ? 'Pause' : 'Play';
    }
    if (Array.isArray(s.bins) && s.bins.length) {
      const n = Math.min(64, s.bins.length);
      if (fData.length !== n) fData = new Uint8Array(n);
      for (let i = 0; i < n; i++) fData[i] = s.bins[i] & 255;
    } else if (Array.isArray(s.rfBins) && s.rfBins.length) {
      // spectrum from RTL sweep
      const n = Math.min(64, s.rfBins.length);
      if (fData.length !== n) fData = new Uint8Array(n);
      let minP = Infinity, maxP = -Infinity;
      for (let i = 0; i < n; i++) {
        const p = Number(s.rfBins[i].p);
        if (p < minP) minP = p;
        if (p > maxP) maxP = p;
      }
      if (!(maxP > minP)) maxP = minP + 20;
      for (let i = 0; i < n; i++) {
        const t = (Number(s.rfBins[i].p) - minP) / (maxP - minP);
        fData[i] = Math.max(0, Math.min(255, (t * 255) | 0));
      }
      if (s.mode) vizMode = String(s.mode);
    }
    const bits = [];
    if (s.vol != null) {
      const v = Math.round(Number(s.vol) * 100);
      volEl.value = String(v);
      volVal.textContent = s.muted ? 'MUTE' : (v + '%');
      bits.push(s.muted ? 'MUTE' : (v + '%'));
    }
    if (s.hb) {
      const age = Math.round((Date.now() - Number(s.hb)) / 1000);
      window._lastHostHb = Date.now();
      bits.push(age <= 3 ? 'PC OK' : ('PC ' + age + 's'));
    }
    if (playing) bits.push('LIVE');
    else bits.push('HALT');
    npMeta.textContent = bits.join(' · ') || '—';
  }

  function styleForMode(mode) {
    const m = String(mode || '').toUpperCase();
    if (/POLAR|RADIAL|CIRCULAR|ORB|SINGULARITY|AURA|EYE|HELIX/.test(m)) return 'radial';
    if (/SCOPE|WAVE|OSCILLO|LISSAJOUS|CRT|STRING|MOIRE|RIDGE/.test(m)) return 'wave';
    if (/PARTICLE|MATRIX|RAIN|DUST|POINT|KOI|FERRO/.test(m)) return 'particles';
    if (/TUNNEL|HYPER|TRANCE|NEON-TUNNEL|TRON/.test(m)) return 'tunnel';
    if (/OFF|INFO|LIBRARY|PIC|VIDEO|DEBUG|GAMES/.test(m)) return 'idle';
    return 'bars';
  }

  function drawViz() {
    const w = canvas.width, h = canvas.height;
    const t = (performance.now() - t0) / 1000;
    ctx.fillStyle = 'rgba(10,10,8,0.35)';
    ctx.fillRect(0, 0, w, h);

    const style = styleForMode(vizMode);
    const n = fData.length || 32;
    let energy = 0;
    for (let i = 0; i < n; i++) energy += fData[i];
    energy = (energy / (n * 255)) || 0;
    if (!playing) energy *= 0.15;

    const accent = '#c4843a';
    const mid = '#e8c07a';

    if (style === 'idle') {
      ctx.strokeStyle = 'rgba(196,132,58,0.25)';
      ctx.beginPath();
      ctx.moveTo(16, h / 2);
      ctx.lineTo(w - 16, h / 2);
      ctx.stroke();
    } else if (style === 'wave') {
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const x = (i / (n - 1)) * w;
        const v = (fData[i] / 255) * (h * 0.42);
        const y = h / 2 + ((i % 2) ? v : -v) * (0.6 + energy);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    } else if (style === 'radial') {
      const cx = w / 2, cy = h / 2;
      const maxR = Math.min(w, h) * 0.38;
      for (let i = 0; i < n; i++) {
        const a0 = (i / n) * Math.PI * 2 - Math.PI / 2;
        const a1 = ((i + 0.7) / n) * Math.PI * 2 - Math.PI / 2;
        const r = maxR * (0.25 + (fData[i] / 255) * 0.75);
        ctx.strokeStyle = i % 3 ? accent : mid;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, a0, a1);
        ctx.stroke();
      }
    } else if (style === 'particles') {
      for (let i = 0; i < n; i++) {
        const x = ((i * 47 + t * (30 + fData[i] * 0.4)) % (w + 20)) - 10;
        const y = (i / n) * h;
        const s = 1.5 + (fData[i] / 255) * 4;
        ctx.fillStyle = i % 2 ? accent : mid;
        ctx.globalAlpha = 0.35 + (fData[i] / 255) * 0.65;
        ctx.beginPath();
        ctx.arc(x, y, s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (style === 'tunnel') {
      const cx = w / 2, cy = h / 2;
      for (let i = 0; i < 12; i++) {
        const idx = Math.floor((i / 12) * n);
        const r = 8 + i * 10 + (fData[idx] / 255) * 18 + (t * 40) % 12;
        ctx.strokeStyle = `rgba(196,132,58,${0.15 + (fData[idx] / 255) * 0.55})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else {
      // bars
      const gap = 2;
      const bw = (w - gap * (n - 1)) / n;
      for (let i = 0; i < n; i++) {
        const bh = (fData[i] / 255) * (h - 8);
        const x = i * (bw + gap);
        const y = h - bh;
        const g = ctx.createLinearGradient(0, y, 0, h);
        g.addColorStop(0, mid);
        g.addColorStop(1, accent);
        ctx.fillStyle = g;
        ctx.fillRect(x, y, Math.max(1, bw), bh);
      }
    }
    raf = requestAnimationFrame(drawViz);
  }
  raf = requestAnimationFrame(drawViz);

  function connect() {
    const id = hostIdFromCode(codeInp.value);
    if (!id) { setErr('Enter the code from the PC'); return; }
    if (typeof Peer === 'undefined') {
      setErr('PeerJS failed to load — check internet');
      return;
    }
    localStorage.setItem('erndub_remote_code', codeInp.value.trim().toUpperCase());
    setErr('');
    setStatus('Connecting…', false);

    try { if (conn) conn.close(); } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}

    peer = new Peer({
      debug: 0,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    });

    const timeout = setTimeout(() => {
      if (!conn || !conn.open) {
        setStatus('Offline', false);
        setErr('Timed out — is Remote on on the PC?');
        pairCard.classList.remove('hidden');
      }
    }, 20000);

    peer.on('open', () => {
      conn = peer.connect(id, { reliable: true });
      conn.on('open', () => {
        clearTimeout(timeout);
        setStatus('Connected', true);
        setErr('');
        send('hello');
        send('state');
      });
      conn.on('data', (msg) => {
        if (!msg || typeof msg !== 'object') return;
        if (msg.t === 'state') applyState(msg.state);
        if (msg.t === 'err') setErr(msg.message || 'Error');
      });
      conn.on('close', () => {
        setStatus('Offline', false);
        pairCard.classList.remove('hidden');
        hint.classList.remove('hidden');
      });
      conn.on('error', (e) => {
        setStatus('Offline', false);
        setErr((e && e.message) || 'Connection error');
        pairCard.classList.remove('hidden');
      });
    });
    peer.on('error', (e) => {
      clearTimeout(timeout);
      setStatus('Offline', false);
      pairCard.classList.remove('hidden');
      const m = (e && e.type === 'peer-unavailable')
        ? 'Code not found — turn Remote on on the PC'
        : ((e && e.message) || 'Peer error');
      setErr(m);
    });
  }

  $('btn-connect').onclick = connect;
  codeInp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') connect();
  });
  document.querySelectorAll('[data-cmd]').forEach((btn) => {
    btn.addEventListener('click', () => send(btn.getAttribute('data-cmd')));
  });
  volEl.addEventListener('input', () => {
    const v = Number(volEl.value) / 100;
    volVal.textContent = Math.round(v * 100) + '%';
    const now = Date.now();
    if (now - lastVolSend < 40) return;
    lastVolSend = now;
    send('volume', { vol: v });
  });
})();
</script>
</body>
</html>
